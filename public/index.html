<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Upload XLS</title>
  </head>
  <body>
    <h2>Enviar arquivo XLS</h2>

    <p id="credits">R$ 0,00</p>

    <form id="form">
      <input type="email" name="email" placeholder="E-mail" required />
      <br /><br />

      <input type="file" name="file" accept=".xls,.xlsx" required />
      <br /><br />

      <button type="submit">Enviar</button>
    </form>

    <script>
      const form = document.getElementById('form');
      const credits = document.getElementById('credits');

      async function updateCredits() {
        const response = await fetch('/api/credits/escavador');
        const data = await response.json();

        console.log(data);
        credits.textContent = `${data.saldo_descricao}`;
      }

      updateCredits();

      form.addEventListener('submit', async (e) => {
        e.preventDefault();

        const formData = new FormData(form);

        const response = await fetch('/api/people/legal-cases/excel', {
          method: 'POST',
          body: formData,
        });

        if (response.ok) {
          alert('Arquivo enviado com sucesso!');
          //   form.reset();
        } else {
          alert('Erro ao enviar arquivo.');
        }
      });
    </script>
  </body>
</html>
